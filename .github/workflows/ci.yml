name: CI

# Un solo repositorio para backend y frontend: cualquier cambio en src/, web/ o
# tests/ ejercita el pipeline completo. Antes había filtros de ruta que sólo
# cubrían el backend, así que un cambio de frontend no disparaba nada.
on:
  push:
    branches: [main, develop]
    # Las etiquetas de versión disparan el pipeline para que las imágenes salgan etiquetadas
    # como v1.2.3, 1.2 y 1. Sin esto, los patrones semver del trabajo `imagenes` no se
    # activan nunca y toda versión quedaría identificada sólo por su commit.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

# Cancela ejecuciones anteriores de la misma rama: en PRs con varios push
# seguidos no tiene sentido pagar por builds que ya están obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CrmSaaS.sln

      - name: Build
        run: dotnet build CrmSaaS.sln --no-restore --configuration Release

      # Un solo paso para las dos suites y la cobertura, porque el umbral se
      # comprueba sobre el informe fusionado: las unitarias cubren el dominio y
      # las de integración son las únicas que cargan Infrastructure y los
      # endpoints. Por separado, ninguna de las dos cifras significa nada; y
      # medir sólo las unitarias dejaba diez módulos fuera del informe.
      #
      # Sin `continue-on-error`: si fallan las pruebas o la cobertura baja del
      # umbral, el CI debe ponerse rojo. Antes este paso no podía fallar nunca
      # —faltaba coverlet.collector, así que no había recolector y `dotnet test`
      # devolvía 0 igualmente— y llevaba desde el principio sin medir nada.
      - name: Tests y cobertura
        run: scripts/cobertura.sh
        env:
          COBERTURA_UMBRAL: '68'
          # El umbral de ramas va aparte porque la cobertura de líneas está
          # inflada por construcción: la capa Presentation pesa el 22 % de las
          # líneas medidas y sale al 98 %, no porque las pruebas llamen a los
          # endpoints —hay módulos a los que ninguna llama— sino porque las
          # líneas `MapGet(...)` se ejecutan al registrar las rutas, en el
          # arranque. El registro no tiene ramas, así que la cobertura de ramas
          # no admite ese engaño: es la que dice si se probaron los dos lados de
          # cada decisión.
          COBERTURA_UMBRAL_RAMAS: '57'

      # El resumen sale en la pestaña Summary del run, sin descargar artefactos.
      - name: Resumen de cobertura en el run
        if: always()
        run: |
          if [ -f coverage/report/SummaryGithub.md ]; then
            cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # `always()`: cuando el umbral es lo que falla, el informe es justo lo que
      # hace falta para ver qué bajó.
      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./coverage/report
          retention-days: 7

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # npm, no pnpm: angular.json declara npm como gestor de paquetes y
      # package-lock.json es el lockfile de referencia.
      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm poda las dependencias opcionales a la plataforma anfitriona al escribir el
      # lockfile (npm/cli#4828). Un `npm install` desde Windows con npm < 11 deja fuera
      # los binarios de Linux de rollup y esbuild, y `npm ci` aquí instala un árbol sin
      # ellos: el fallo aparece minutos después, al arrancar el servidor de los E2E, con
      # un mensaje que no señala la causa. Esta comprobación lo dice al instante.
      - name: Verificar que el lockfile cubre Linux
        run: |
          for pkg in @rollup/rollup-linux-x64-gnu @esbuild/linux-x64; do
            if ! grep -q "\"node_modules/$pkg\"" package-lock.json; then
              echo "::error::package-lock.json no incluye $pkg."
              echo "Se generó con npm < 11, que poda las dependencias opcionales a la"
              echo "plataforma anfitriona. Regenéralo con:  npx npm@11 install --package-lock-only"
              exit 1
            fi
          done
          echo "El lockfile incluye los binarios de Linux."

      - name: Instalar dependencias
        run: npm ci

      # El catálogo de traducción tiene que estar al día con el código. Si alguien añade
      # un texto y no re-extrae, el idioma inglés se queda con ese texto en español y
      # nadie lo nota hasta que un usuario lo ve. Comprobarlo aquí cuesta segundos.
      - name: Comprobar que el catálogo i18n está al día
        run: |
          cp src/locale/messages.xlf /tmp/messages.antes.xlf
          npm run i18n:extract --silent
          if ! diff -q /tmp/messages.antes.xlf src/locale/messages.xlf > /dev/null; then
            echo "::error::El catálogo de traducción está desfasado respecto al código."
            echo "Ejecuta 'npm run i18n:extract' y traduce las cadenas nuevas en"
            echo "src/locale/messages.en.xlf antes de subir."
            diff /tmp/messages.antes.xlf src/locale/messages.xlf | head -40
            exit 1
          fi
          echo "El catálogo está al día."

      # Una cadena sin traducir sale en español dentro de la versión inglesa.
      - name: Comprobar que no quedan cadenas sin traducir
        run: |
          pendientes=$(grep -c 'state="needs-translation"' src/locale/messages.en.xlf || true)
          if [ "$pendientes" != "0" ]; then
            echo "::error::Hay $pendientes cadenas sin traducir en messages.en.xlf."
            grep -B3 'state="needs-translation"' src/locale/messages.en.xlf | head -30
            exit 1
          fi
          echo "Todas las cadenas están traducidas."

      # Sin `|| true`: la línea base es 0 errores. Los ~180 avisos de deuda
      # heredada no rompen el build, pero un error nuevo sí.
      - name: Lint
        run: npm run lint

      # `ng build` compila los dos idiomas a la vez: dist/web/browser/{es,en}.
      - name: Build
        run: npm run build

      - name: Comprobar que se generaron los dos idiomas
        run: |
          for idioma in es en; do
            if [ ! -f "dist/web/browser/$idioma/index.html" ]; then
              echo "::error::Falta el bundle del idioma $idioma."
              exit 1
            fi
          done
          echo "Bundles de es y en generados."

      # ChromeHeadless viene con el runner; no hace falta instalar nada aquí.
      #
      # `codeCoverage` está activo en angular.json y karma.conf.js fija umbrales,
      # así que este paso se pone rojo si la cobertura del frontend retrocede.
      # Los umbrales son un trinquete puesto justo por debajo de lo medido, no la
      # meta: un build permanentemente rojo se acaba ignorando.
      - name: Tests unitarios de frontend
        run: npm run test:ci

      - name: Resumen de cobertura del frontend
        if: always()
        run: |
          if [ -f coverage/web/coverage-summary.json ]; then
            {
              echo "### Cobertura del frontend"
              echo ""
              echo "| Métrica | % | Cubierto / Total |"
              echo "|---|---:|---:|"
              node -e '
                const t = require("./coverage/web/coverage-summary.json").total;
                const nombres = { lines: "Líneas", statements: "Sentencias", branches: "Ramas", functions: "Funciones" };
                for (const k of Object.keys(nombres)) {
                  console.log(`| ${nombres[k]} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/web
          retention-days: 7

      # Sólo el navegador que usa la suite: instalar los tres multiplicaría por varios
      # minutos un paso que no aporta cobertura adicional.
      - name: Instalar navegador para E2E
        run: npx playwright install --with-deps chromium

      # playwright.config.ts arranca `npm start` por su cuenta, así que no hace falta
      # levantar el servidor en un paso previo.
      - name: Tests E2E
        run: npm run e2e

      - name: Publicar informe E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/web/browser
          retention-days: 7

  seguridad:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CrmSaaS.sln

      - name: Vulnerabilidades en NuGet
        run: dotnet list CrmSaaS.sln package --vulnerable --include-transitive || true

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Vulnerabilidades en npm
        working-directory: web
        run: npm audit --audit-level=high || true

      # Red de seguridad contra el fallo que ya ocurrió una vez: credenciales
      # reales versionadas en appsettings.json y docker-compose.yml.
      - name: Verificar que no hay secretos versionados
        run: |
          set -e
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git \
               -E '(Password|Pwd)=[^;"$ ]{3,}' \
               --include='*.json' --include='*.yml' --include='*.yaml' . \
             | grep -v '.env.example' \
             | grep -v 'appsettings.Development.json'; then
            echo "::error::Se detectaron credenciales en archivos versionados."
            exit 1
          fi
          echo "Sin credenciales versionadas."

  # ════════════════════════════════════════════════════════════════════ IMÁGENES ═══
  #
  # Construye y publica las imágenes en el registro de contenedores de GitHub (GHCR).
  #
  # Esto es lo que convierte «desplegable en cualquier plataforma» en algo real: una imagen
  # publicada y versionada la arranca igual Kubernetes, ECS, Cloud Run, Swarm, Fly o un
  # `docker run` en un servidor. Antes no se construía ninguna imagen en el CI, así que los
  # Dockerfiles sólo se ejercitaban cuando alguien los usaba a mano — y llevaban dentro un
  # `healthcheck` que invocaba un `curl` inexistente y un `npm install` que ignoraba el
  # lockfile. Nada de eso podía salir a la luz sin construirlas aquí.
  imagenes:
    name: Imágenes — construir y publicar
    runs-on: ubuntu-latest
    needs: [backend, frontend, seguridad]

    # En un pull request se construyen pero NO se publican: interesa saber si el Dockerfile
    # sigue funcionando, no llenar el registro de imágenes de ramas que quizá no se mezclen.
    permissions:
      contents: read
      packages: write
      # Para la atestación de procedencia: deja constancia firmada de qué commit y qué
      # workflow produjeron cada imagen. Sin ella, una imagen en el registro es un binario
      # sin origen comprobable.
      id-token: write
      attestations: write

    strategy:
      # Si una imagen falla, la otra termina igual: saber que sólo una está rota es
      # información, y con fail-fast se pierde.
      fail-fast: false
      matrix:
        include:
          - nombre: api
            contexto: .
            dockerfile: src/Host/ApiHost/Dockerfile
          - nombre: web
            contexto: ./web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # QEMU para poder construir arm64 desde un runner x86. Cuesta minutos, y se paga sólo
      # en las construcciones que se publican: los servidores arm —Graviton, Ampere— son
      # bastante más baratos, y una imagen que sólo existe para amd64 cierra esa puerta.
      - name: Preparar QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las etiquetas salen de aquí en vez de escribirse a mano:
      #   - `sha-<commit>` en todas. Es la única que identifica sin ambigüedad qué se
      #     desplegó, y la que debe usar producción.
      #   - `main` / `develop` para la última de cada rama.
      #   - `latest` sólo en la rama por defecto.
      #   - `v1.2.3`, `1.2` y `1` cuando el disparo es una etiqueta de versión.
      - name: Calcular etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.nombre }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=CRM SaaS Suite — ${{ matrix.nombre }}
            org.opencontainers.image.description=Gestión de trabajo con helpdesk integrado

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multiarquitectura sólo al publicar: en un PR duplicaría el tiempo para
          # comprobar lo mismo.
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # Caché en la propia caché de Actions. `mode=max` guarda también las capas
          # intermedias, que es lo que ahorra de verdad en una compilación por etapas.
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,scope=${{ matrix.nombre }},mode=max
          provenance: true
          sbom: true

      - name: Atestiguar la procedencia
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.nombre }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Que la imagen arranque y se declare sana. Construir sólo demuestra que compila.
      #
      # Se comprueba la del frontend, que se sostiene sola. La de la API necesita una base de
      # datos y su arranque real lo cubren las pruebas de integración, que levantan MySQL.
      - name: Comprobar que la imagen del frontend arranca y queda sana
        if: matrix.nombre == 'web' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          etiqueta=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name comprobacion -p 8080:8080 "$etiqueta"

          # Hasta 60 s. El `start-period` del Dockerfile es de 10 s.
          for _ in $(seq 1 20); do
            estado=$(docker inspect comprobacion --format '{{.State.Health.Status}}')
            [ "$estado" = "healthy" ] && break
            [ "$estado" = "unhealthy" ] && { echo "::error::La imagen arrancó pero se declara enferma."; docker logs comprobacion; exit 1; }
            sleep 3
          done

          [ "$estado" = "healthy" ] || { echo "::error::La imagen no llegó a estar sana en 60 s."; docker logs comprobacion; exit 1; }

          # Y que sirva algo de verdad, no sólo que el proceso esté vivo.
          codigo=$(docker exec comprobacion wget -q -O /dev/null -S http://127.0.0.1:8080/es/ 2>&1 | awk '/HTTP\//{print $2; exit}')
          [ "$codigo" = "200" ] || { echo "::error::La página en español devolvió $codigo."; exit 1; }

          echo "La imagen arranca, se declara sana y sirve la aplicación."
          docker rm -f comprobacion

  # ════════════════════════════════════════════════════════════════════ DESPLIEGUE ═══
  #
  # NO hay pasos de despliegue automático, y es deliberado.
  #
  # Aquí había dos trabajos, «Desplegar a staging» y «Desplegar a producción», cuyo contenido
  # real era:
  #
  #     - name: Desplegar backend
  #       run: 'echo "Pendiente: integrar con el proveedor cloud"'
  #
  # Salían en verde. Un despliegue que siempre tiene éxito porque no hace nada es peor que no
  # tenerlo: el panel de Actions decía que producción se había actualizado, y no era cierto.
  # Se han quitado.
  #
  # Lo que sí hay ahora es lo que hace falta para desplegar en cualquier sitio: imágenes
  # multiarquitectura publicadas y versionadas en GHCR, con procedencia atestiguada. El
  # último paso —qué plataforma y con qué credenciales— depende de una decisión que aún no
  # está tomada, y las instrucciones para hacerlo a mano están en docs/DESPLIEGUE.md.
  #
  # Cuando haya destino, este es el sitio; el trabajo necesita `environment:` para que
  # GitHub pida la aprobación y guarde los secretos, y debe desplegar por digestión
  # (`@sha256:…`) y no por etiqueta, porque una etiqueta se puede mover.
