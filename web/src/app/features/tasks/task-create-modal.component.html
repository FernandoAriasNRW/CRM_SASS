<app-drawer [isOpen]="true" (closed)="close()" i18n-title title="Nueva Tarea" subtitle="Crea una nueva tarea en tu proyecto">
  <div class="space-y-4 py-2">
    <div class="space-y-1.5">
      <label uiLabel for="task-title" i18n>Título *</label>
      <input uiInput id="task-title" [(ngModel)]="title" i18n-placeholder placeholder="Título de la tarea" />
    </div>
    <div class="space-y-1.5">
      <label uiLabel for="task-desc" i18n>Descripción</label>
      <input uiInput id="task-desc" [(ngModel)]="description" i18n-placeholder placeholder="Descripción opcional" />
    </div>
    <div class="space-y-1.5">
      <label uiLabel for="task-project" i18n>Proyecto *</label>
      <select id="task-project" [(ngModel)]="projectId"
              class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
        <option value="" i18n>Seleccionar proyecto</option>
        @for (p of projects$ | async; track p.id) {
          <option [value]="p.id">{{ p.name }}</option>
        }
      </select>
    </div>
    <div class="space-y-1.5">
      <label uiLabel for="task-priority" i18n>Prioridad</label>
      <select id="task-priority" [(ngModel)]="priority"
              class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
        @for (p of prioridades; track p.key) {
          <option [value]="p.key">{{ p.label }}</option>
        }
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="space-y-1.5">
        <label uiLabel for="task-hours" i18n>Horas estimadas</label>
        <input uiInput id="task-hours" type="number" [(ngModel)]="estimatedHours" min="0.5" step="0.5" />
      </div>
      <div class="space-y-1.5">
        <label uiLabel for="task-due" i18n>Fecha límite *</label>
        <input uiInput id="task-due" type="date" [(ngModel)]="dueDate" />
      </div>
    </div>
    @if (error()) {
      <p class="text-sm text-destructive">{{ error() }}</p>
    }
  </div>

  <div drawer-footer class="flex justify-end gap-2 w-full">
    <button uiButton variant="outline" (click)="close()" i18n>Cancelar</button>
    <button uiButton (click)="submit()" [disabled]="loading()">
      {{ loading() ? 'Creando...' : 'Crear tarea' }}
    </button>
  </div>
</app-drawer>
