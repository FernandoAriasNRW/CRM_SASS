<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4">
  <div class="w-full max-w-md rounded-lg border border-border bg-card shadow-xl">
    <div class="flex items-center justify-between px-6 py-4 border-b border-border">
      <h3 class="text-base font-semibold" i18n>Solicitar Nuevo Reporte</h3>
      <button (click)="close()" class="text-muted-foreground hover:text-foreground transition-colors text-lg leading-none" i18n>&times;</button>
    </div>

    <div class="px-6 py-4 space-y-4">
      <div class="space-y-1.5">
        <label uiLabel for="report-name" i18n>Nombre del Reporte *</label>
        <input uiInput id="report-name" [(ngModel)]="name" i18n-placeholder placeholder="Ej: Progreso Q3" />
      </div>

      <div class="space-y-1.5">
        <label uiLabel for="report-type" i18n>Tipo *</label>
        <select id="report-type" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background" [(ngModel)]="type">
          <option value="ProjectProgress" i18n>Progreso de Proyectos</option>
          <option value="TaskBreakdown" i18n>Distribución de Tareas</option>
          <option value="KpiSummary" i18n>Resumen de KPIs</option>
          <option value="Custom" i18n>Personalizado</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label uiLabel for="report-format" i18n>Formato *</label>
        <select id="report-format" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background" [(ngModel)]="format">
          <option value="PDF" i18n>PDF</option>
          <option value="Excel" i18n>Excel / Spreadsheet</option>
          <option value="CSV" i18n>CSV</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label uiLabel for="report-params" i18n>Parámetros Adicionales (JSON Opcional)</label>
        <input uiInput id="report-params" [(ngModel)]="parameters" placeholder='{"projectId": "..."}' />
      </div>

      @if (error()) {
        <p class="text-sm text-destructive">{{ error() }}</p>
      }
    </div>

    <div class="flex justify-end gap-2 px-6 py-4 border-t border-border">
      <button uiButton variant="outline" (click)="close()" i18n>Cancelar</button>
      <button uiButton (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'Solicitando...' : 'Solicitar Generación' }}
      </button>
    </div>
  </div>
</div>
