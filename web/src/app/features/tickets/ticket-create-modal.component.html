<app-drawer [isOpen]="true" (closed)="close()" i18n-title title="Nuevo Ticket" subtitle="Crea un nuevo ticket de soporte">
  <div class="space-y-4 py-2">
    <div class="space-y-1.5">
      <label uiLabel for="t-title" i18n>Título *</label>
      <input uiInput id="t-title" [(ngModel)]="title" i18n-placeholder placeholder="Ej: Problema con facturación" />
    </div>

    <div class="space-y-1.5">
      <label uiLabel for="t-priority" i18n>Prioridad</label>
      <select id="t-priority" [(ngModel)]="priority"
              class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
        @for (p of priorities; track p.key) {
          <option [value]="p.key">{{ p.label }}</option>
        }
      </select>
    </div>

    <div class="space-y-1.5">
      <label uiLabel for="t-description" i18n>Descripción *</label>
      <textarea id="t-description" [(ngModel)]="description" rows="5"
                i18n-placeholder placeholder="Describe el problema en detalle..."
                class="flex w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring resize-none">
      </textarea>
    </div>

    @if (error()) {
      <p class="text-sm text-destructive">{{ error() }}</p>
    }
  </div>

  <div drawer-footer class="flex justify-end gap-2 w-full">
    <button uiButton variant="outline" (click)="close()" i18n>Cancelar</button>
    <button uiButton (click)="submit()" [disabled]="loading()">
      @if (loading()) { <span i18n>Creando...</span> } @else { <span i18n>Crear ticket</span> }
    </button>
  </div>
</app-drawer>
