# Servidor del frontend, con un artefacto por idioma.
#
# `@angular/localize` compila una copia completa de la aplicación por cada idioma, así que
# `dist/web/browser` contiene ahora `es/` y `en/` en lugar de un `index.html` suelto. Ese
# es el precio de la traducción en tiempo de compilación: nada que resolver en el
# navegador, pero el servidor tiene que saber a qué carpeta enviar cada visita.

# Qué idioma pidió el navegador. El español es el valor por defecto: cualquier cabecera
# que no empiece por `en` acaba ahí.
map $http_accept_language $idioma_del_navegador {
    default          es;
    ~*^en            en;
    ~*,\s*en         en;
}

# La elección de la persona, que **manda sobre la del navegador**.
#
# Sin esto, el idioma lo decide la configuración de Chrome y no hay forma de cambiarlo desde
# la aplicación: quien tiene el navegador en inglés se queda en inglés para siempre aunque
# quiera trabajar en español. La aplicación escribe esta cookie al elegir idioma.
#
# Sólo se aceptan los dos valores conocidos. Con `default ''` cualquier otra cosa —una cookie
# manipulada— cae en el idioma del navegador en lugar de construir una ruta inventada.
map $cookie_idioma $idioma_elegido {
    default   '';
    es        es;
    en        en;
}

map $idioma_elegido $idioma_preferido {
    default   $idioma_elegido;
    ''        $idioma_del_navegador;
}

server {
    # 8080 y no 80: la imagen es `nginx-unprivileged` y un proceso sin privilegios no puede
    # abrir un puerto por debajo de 1024. El cambio es lo que permite desplegar en
    # plataformas que rechazan contenedores que corren como root.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # Redirecciones relativas: `Location: /es/` en lugar de `Location: http://host:8080/es/`.
    #
    # Por defecto nginx construye la URL absoluta con el puerto en el que escucha, que es el
    # de dentro del contenedor. Detrás de un proxy, un balanceador o un ingress —o sea, en
    # cualquier despliegue real— eso manda al visitante a un puerto que no está publicado, y
    # el fallo sólo aparece fuera de la máquina de desarrollo. Con la redirección relativa el
    # navegador conserva el esquema, el dominio y el puerto por los que llegó.
    absolute_redirect off;

    # La raíz no sirve nada por sí misma: redirige al idioma que corresponda.
    #
    # Es 302 y no 301 a propósito. Un permanente lo cachea el navegador para siempre, y
    # quien entrara una vez con el navegador en inglés se quedaría clavado en /en/ aunque
    # después cambiara de idioma, sin forma evidente de deshacerlo.
    location = / {
        return 302 /$idioma_preferido/;
    }

    # `/es` y `/en` sin la barra final.
    #
    # **Sin esto, escribir `/es` llevaba al inglés.** `location /es/` exige la barra, así que
    # `/es` caía en el `location /` de más abajo y se convertía en `/en/es`: la aplicación
    # inglesa intentando abrir una ruta llamada «es», que su enrutador no conoce, y de ahí a la
    # pantalla de inicio. El idioma acababa siendo justo el contrario del que se pidió.
    location = /es {
        return 302 /es/;
    }

    location = /en {
        return 302 /en/;
    }

    # Cada idioma es una aplicación de una sola página: las rutas internas no existen como
    # ficheros y tienen que caer en el index de SU idioma. Un fallback compartido serviría
    # la aplicación en el idioma equivocado.
    location /es/ {
        try_files $uri $uri/ /es/index.html;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }

    # Estáticos con huella en el nombre: se pueden cachear indefinidamente porque un
    # cambio de contenido cambia el nombre del fichero.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # El index NO se cachea: lleva las referencias a los ficheros con huella, y servirlo
    # antiguo dejaría al navegador pidiendo bundles que ya no existen.
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
    }

    # Cualquier otra ruta suelta (alguien que llega a /tasks sin prefijo de idioma) se
    # manda al idioma preferido en lugar de devolver un 404.
    location / {
        return 302 /$idioma_preferido$uri;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
