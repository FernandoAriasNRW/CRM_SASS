# Credenciales vía `.env` (ver .env.example). Nunca incrustarlas aquí.
services:
  db:
    image: mysql:8.0
    container_name: crm_saas_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-CrmDb}
      MYSQL_USER: ${MYSQL_USER:?falta MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?falta MYSQL_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: crm_saas_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/Host/ApiHost/Dockerfile
    container_name: crm_saas_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${MYSQL_DATABASE:-CrmDb};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};
      - ConnectionStrings__MySql=Server=db;Port=3306;Database=${MYSQL_DATABASE:-CrmDb};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};
      - Jwt__Key=${JWT_KEY:?falta JWT_KEY en .env}
      - Jwt__Issuer=${JWT_ISSUER:-crm-saas-api}
      - Jwt__Audience=${JWT_AUDIENCE:-crm-saas-web}
      - RabbitMQ__Host=rabbitmq

      # Dónde acaban los ficheros que se adjuntan a un documento.
      #
      # Con credenciales de Cloudinary se suben a Cloudinary; sin ellas, al disco del servidor. La
      # elección se hace al arrancar, así que las tres variables pueden faltar y el sistema sigue
      # funcionando: lo que no puede pasar es que parezca que sabe subir ficheros y no sepa.
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME:-}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY:-}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET:-}

      # El disco es la reserva. Va a un volumen para que los ficheros sobrevivan a recrear el
      # contenedor, y a una ruta escribible: la imagen corre con usuario sin privilegios.
      - AlmacenEnDisco__Carpeta=/var/almacen
    volumes:
      - almacen_data:/var/almacen
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - crm_network
    # La imagen ya trae su propia comprobación (ver el Dockerfile) y esto la repetía... con
    # `curl`, que la imagen de ASP.NET no incluye: llevaba 1.590 fallos consecutivos y el
    # contenedor figuraba como «unhealthy» permanentemente. Se deja que mande la de la imagen,
    # que es la que viaja a cualquier otra plataforma.
    healthcheck:
      test: ["CMD", "dotnet", "ApiHost.dll", "--health-check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: crm_saas_web
    ports:
      # 8080 dentro: la imagen es nginx-unprivileged y un proceso sin privilegios no puede
      # abrir un puerto por debajo de 1024. Fuera sigue siendo 4200, que es lo que esperan
      # los CORS de la API y las pruebas de extremo a extremo.
      - "4200:8080"
    depends_on:
      # Ahora que la comprobación de la API funciona de verdad, se puede esperar a que esté
      # sana en lugar de a que el contenedor exista. Antes esto habría colgado el arranque
      # para siempre.
      api:
        condition: service_healthy
    networks:
      - crm_network

volumes:
  db_data:
  almacen_data:

networks:
  crm_network:
    driver: bridge
